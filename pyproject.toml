[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-rag"
version = "1.0.0"
description = "Air-gapped question answering over massive PDFs: local models, in-memory index, verified citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
demo = ["reportlab>=4.0"]
dev = ["pytest>=8", "reportlab>=4.0"]

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools]
packages = ["airlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 1,000+ page tests"]
