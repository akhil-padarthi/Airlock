name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The tests use stand-in models, so the big ML packages (torch etc.) aren't needed here.
      - name: Install test dependencies
        run: pip install numpy pypdf reportlab pytest
      - name: Run tests
        run: pytest -q
